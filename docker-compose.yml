services:
  api:
    build: .
    working_dir: /data/backend
    command: >
      sh -c "
        rm -f tmp/pids/server.pid &&
        bundle install &&
        bin/rails db:prepare &&
        rails server -b 0.0.0.0
      "
    ports:
      - 65432:3000
    volumes:
      - ./:/data
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:3000
      WATCH_POLLING: "true"
    depends_on:
      - api

volumes:
  web_node_modules:
